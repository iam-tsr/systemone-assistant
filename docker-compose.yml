services:
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    image: systemone-mongo:latest
    container_name: systemone-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: systemone
    volumes:
      - systemone-mongo-data:/data/db

volumes:
  systemone-mongo-data:
