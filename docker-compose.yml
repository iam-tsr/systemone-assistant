services:
  mongodb:
    image: mongo:7.0
    container_name: systemone-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SERVER_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVER_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${SERVER_MONGO_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - systemone-data:/data/db
    restart: unless-stopped
    networks:
      - db-network

  backend:
    build:
      context: ./backend
    container_name: systemone-backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://${SERVER_MONGO_USER}:${SERVER_MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_DATABASE: ${SERVER_MONGO_DATABASE}      
    extra_hosts:
      - "host.docker.internal:host-gateway"      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - web-network
      - db-network

  frontend:
    build:
      context: ./frontend
    container_name: systemone-frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - web-network

volumes:
  systemone-data:
    driver: local

networks:
  web-network:
    driver: bridge
  db-network:
    driver: bridge