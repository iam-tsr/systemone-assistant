services:
  mongodb:
    image: mongo:7.0
    container_name: systemone-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: tarun
      MONGO_INITDB_DATABASE: systemone
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - systemone-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: systemone-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://root:tarun@mongodb:27017/?authSource=admin
      MONGO_DATABASE: systemone
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: systemone-frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 3000
      API_ORIGIN: http://backend:8001
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  systemone-data: